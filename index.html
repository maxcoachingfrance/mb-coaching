<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Anglais jour après jour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F4F9; --surface:#FFFFFF; --ink:#15203B; --muted:#58637F; --line:#D5DCE9;
  --accent:#2547C8; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF;
  --note:#FFD84D; --note-soft:#FFF4C2; --note-ink:#4A3A00;
  --good:#17794F; --good-soft:#DDF3E8; --bad:#B63A34; --bad-soft:#FBE3E1;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1527; --surface:#172038; --ink:#E8EDF9; --muted:#9AA6C4; --line:#2A3556;
    --accent:#8FA6FF; --accent-ink:#0F1527; --accent-soft:#222E5C;
    --note:#E8BE2E; --note-soft:#3A3213; --note-ink:#FFE9A0;
    --good:#5CD39A; --good-soft:#12362A; --bad:#FF8A80; --bad-soft:#3F1D1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1527; --surface:#172038; --ink:#E8EDF9; --muted:#9AA6C4; --line:#2A3556;
  --accent:#8FA6FF; --accent-ink:#0F1527; --accent-soft:#222E5C;
  --note:#E8BE2E; --note-soft:#3A3213; --note-ink:#FFE9A0;
  --good:#5CD39A; --good-soft:#12362A; --bad:#FF8A80; --bad-soft:#3F1D1B;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.app{max-width:720px;margin:0 auto;padding:0 16px 72px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line);margin:0 -16px;padding:0 16px}
.top .ttl{font-family:var(--font-head);font-weight:600;font-size:1rem}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent}
.iconbtn:hover{background:var(--accent-soft)}
svg{display:block}

h1{font-family:var(--font-head);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin:0}
.hero{padding:28px 0 8px}
.hero h1{font-size:clamp(2.2rem,9vw,3.1rem)}
.hero p{margin:12px 0 0;color:var(--muted);max-width:34ch}

.next{margin:22px 0 8px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px}
.next .k{font-size:.95rem;opacity:.85}
.next .t{font-family:var(--font-head);font-weight:800;font-size:1.6rem;line-height:1.1;margin:4px 0 2px}
.next .s{opacity:.85;margin-bottom:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:999px;border:2px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.light{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:14px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.progress-text{margin-top:8px;color:var(--muted);font-size:.95rem}

details.how{margin:18px 0 6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 16px}
details.how summary{min-height:48px;display:flex;align-items:center;font-weight:700;cursor:pointer}
details.how ol{margin:0 0 14px;padding-left:20px}
details.how li{margin:6px 0}

.wk{font-family:var(--font-head);font-weight:600;font-size:1.05rem;margin:28px 0 10px;color:var(--muted)}
summary.wk{cursor:pointer;min-height:44px;display:flex;align-items:center;margin:14px 0 6px}
details.wkd[open] > summary.wk{color:var(--ink)}
.list{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:64px}
.lrow.rev{background:var(--accent-soft);border-color:transparent}
.lrow:hover{border-color:var(--accent)}
.lnum{font-family:var(--font-head);font-weight:800;font-size:1.7rem;color:var(--accent);line-height:1}
.lt{font-weight:700;line-height:1.2}
.ls{color:var(--muted);font-size:.92rem}
.badge{font-size:.85rem;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:999px;padding:3px 10px;white-space:nowrap}

.lhead{padding:22px 0 6px}
.lhead h1{font-size:clamp(1.9rem,8vw,2.6rem)}
.lhead .sub{color:var(--muted);margin-top:6px}
.ctrls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 4px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.chip.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--line);border-radius:14px;padding:4px;margin:18px 0 6px}
.tab{min-height:42px;border:0;border-radius:10px;background:transparent;font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink)}

ol.sents{list-style:none;margin:10px 0 0;padding:0}
.row{display:grid;grid-template-columns:30px 1fr;gap:6px 10px;padding:12px 10px;margin:0 -10px;border-radius:14px;border-bottom:1px solid var(--line)}
.row.playing{background:var(--accent-soft)}
.row .n{font-family:var(--font-head);font-weight:800;color:var(--accent);padding-top:2px}
.en{display:inline-flex;align-items:flex-start;gap:8px;text-align:left;border:0;background:transparent;padding:0;font-size:1.18rem;font-weight:700;line-height:1.35}
.en .spk{color:var(--accent);flex:none;margin-top:3px}
.fr{color:var(--muted);margin-top:2px;grid-column:2}
.fr.cover:not(.shown){filter:blur(7px);cursor:pointer;user-select:none}
.nb{display:inline-flex;align-items:center;justify-content:center;min-width:1.2rem;height:1.2rem;padding:0 4px;margin-left:3px;border-radius:99px;background:var(--note);color:#3A2E00;font-size:.75rem;font-weight:700;vertical-align:2px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:18px}
.card h2{font-family:var(--font-head);font-weight:600;font-size:1.15rem;margin:0 0 10px}
.card.notes{border-left:6px solid var(--note);background:var(--note-soft);border-color:transparent;border-left-color:var(--note)}
.card.notes{color:var(--ink)}
.nline{display:grid;grid-template-columns:1.6rem 1fr;gap:8px;margin:10px 0}
.nline .nb{margin:2px 0 0;align-self:start}
.pron{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.pron li{display:flex;flex-wrap:wrap;gap:4px 10px}
.pron b{min-width:7.5em}
.pron span{color:var(--muted)}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 12px}

.exh{font-family:var(--font-head);font-weight:600;font-size:1.25rem;margin:30px 0 4px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.item .q{font-weight:700;font-size:1.08rem;margin-bottom:10px}
.item.ok{border-color:var(--good)}
.item.ko{border-color:var(--bad)}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.98rem}
.fb.ok{background:var(--good-soft);color:var(--good)}
.fb.ko{background:var(--bad-soft);color:var(--bad)}
.fb b{color:var(--ink)}
.two{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input.ans{width:100%;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font:inherit;padding:0 12px}
input.ans:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.opts{display:grid;gap:8px}
.opt{min-height:46px;text-align:left;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:700}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.result{margin-top:26px;border-radius:20px;background:var(--accent);color:var(--accent-ink);padding:20px}
.result .big{font-family:var(--font-head);font-weight:800;font-size:2rem;line-height:1.1}
.result p{margin:6px 0 14px}
.foot{margin-top:40px;color:var(--muted);font-size:.9rem}
.noaudio{background:var(--note-soft);color:var(--ink);border-radius:12px;padding:10px 12px;margin-top:12px;font-size:.95rem}
.card.active{border-left:6px solid var(--accent)}
.t2{font-family:var(--font-head);font-weight:800;font-size:1.3rem;line-height:1.15;margin:4px 0 12px}
select.sel{min-height:44px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 12px;max-width:100%}
@media (min-width:640px){
  .row{grid-template-columns:34px 1fr 1fr;align-items:start}
  .row .fr{grid-column:3;margin-top:3px;padding-left:12px;border-left:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>

{id:1,t:"Hello!",f:"Bonjour !",
 s:[

 }},
{id:2,t:"This and that",f:"Ceci et cela",
 s:[
  ["What’s this?","Qu’est-ce que c’est ?",[1]],

 p:[["key","kî"],["whose","houze"],["station","stéi-chen"],["near","ni-eur"],["far","faar"]],
 n:[

  "a devant un son consonne (a key, a bag), an devant un son voyelle (an orange).",
  "Les possessifs ne changent pas avec le nom : my key, my keys. Ils s’accordent avec la personne qui possède : my, your… (la suite en leçon 3).",
  "It = il, elle ou ce, pour une chose. It’s = it is ; isn’t = is not ; it’s not = it isn’t.",

 }},
{id:3,t:"My family",f:"Ma famille",
 s:[
  ["This is my family.","Voici ma famille.",[]],
  ["I’ve got two brothers and one sister.","J’ai deux frères et une sœur.",[1,2]],
  ["My brothers are older than me.","Mes frères sont plus âgés que moi.",[5]],
  ["Have you got any children?","Avez-vous des enfants ?",[1,5]],
  ["Yes, I’ve got a daughter. She’s six.","Oui, j’ai une fille. Elle a six ans.",[1,4]],
  ["Her name is Emma.","Elle s’appelle Emma.",[3]],
  ["My wife works in a hospital.","Ma femme travaille dans un hôpital.",[6]],
  ["Her mother is a doctor too.","Sa mère (à elle) est médecin aussi.",[3]],

 ],
 p:[["brother","breu-zeur"],["daughter","dô-teur"],["hospital","hos-pi-tel"],["parents","pé-reunts"],["bikes","baïks"]],
 n:[
  "I have got, souvent I’ve got = j’ai (usage britannique très courant). Négation : I haven’t got. Question : Have you got… ? À la 3e personne : he’s got, she hasn’t got.",

 ],

 }},
{id:4,t:"At the market",f:"Au marché",
 s:[
  ["Can I help you?","Puis-je vous aider ?",[]],
  ["I’d like some apples, please.","Je voudrais des pommes, s’il vous plaît.",[1,2]],
  ["How many would you like?","Combien en voulez-vous ?",[3]],
  ["Six, please. And a kilo of tomatoes.","Six, s’il vous plaît. Et un kilo de tomates.",[4]],
  ["Here you are. Anything else?","Voilà. Autre chose ?",[5]],
  ["Have you got any eggs?","Avez-vous des œufs ?",[1]],
  ["Sorry, we haven’t got any today.","Désolé, nous n’en avons pas aujourd’hui.",[1]],

  ["And here’s your change. Have a nice day!","Et voici votre monnaie. Bonne journée !",[6]]
 ],
 p:[["tomatoes","teu-mé-tôze"],["kilo","kî-lo"],["eggs","èggz"],["change","tchéinj"],["pounds","paounds"],["I’d like","aïd laïk"]],
 n:[
  "some s’emploie dans les phrases affirmatives, any dans les questions et les négations : I’d like some apples. / Have you got any eggs ? / We haven’t got any.",

  "How many + pluriel dénombrable (How many apples ?). How much pour un prix ou une quantité indénombrable (How much is it ?).",

  q:[["“I’d like ___ apples, please.”","some",["any","a"]],["“Have you got ___ eggs?”","any",["some","an"]],["“___ is it?” “Four pounds fifty.”","How much",["How many","How long"]]]
 }},
{id:5,t:"A normal day",f:"Une journée ordinaire",
 s:[
  ["I get up at seven o’clock.","Je me lève à sept heures.",[4,7]],
  ["I have breakfast with my children.","Je prends mon petit-déjeuner avec mes enfants.",[5]],
  ["We usually drink tea, not coffee.","Nous buvons généralement du thé, pas du café.",[3]],
  ["They go to school by bus.","Ils vont à l’école en bus.",[5,6]],
  ["I work in an office in the city centre.","Je travaille dans un bureau au centre-ville.",[1]],
  ["Do you work on Saturdays?","Travaillez-vous le samedi ?",[2,4]],
  ["No, I don’t. I stay at home.","Non. Je reste à la maison.",[2,5]],
  ["We don’t watch television in the evening.","Nous ne regardons pas la télévision le soir.",[2,4]],
  ["We often read or play cards.","Nous lisons ou jouons souvent aux cartes.",[3]],
  ["I go to bed at eleven.","Je me couche à onze heures.",[4,5]]
 ],
 p:[["breakfast","brèk-feust"],["usually","iou-jou-eu-li"],["often","o-fen"],["office","o-fice"],["television","tè-li-vi-jen"],["evening","îv-ning"]],
 n:[
  "Le présent simple décrit les habitudes. Avec I, you, we, they, le verbe ne change pas : I work, they go.",
  "Question avec do, négation avec don’t, puis le verbe de base : Do you work ? I don’t work. Réponses courtes : Yes, I do. / No, I don’t.",
  "Les adverbes de fréquence (usually, often, always, never) se placent avant le verbe : We often read.",

  "Pas d’article dans go to school, go to bed, at home. On dit have breakfast (et non « take »).",
  "by + moyen de transport : by bus, by car, by train.",

 ],
 e:{

{id:94,t:"You and you",f:"Tu et vous",

/* ---------- Outils ---------- */
const KEY = "anglais-jour-apres-jour-v1";
const S = { done:{}, hideFr:false, slow:false, reviewed:{} };
try { const r = localStorage.getItem(KEY); if (r) Object.assign(S, JSON.parse(r)); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
const V = { view:"home", id:1, tab:"lecon" };
const EX = {};
const $app = document.getElementById("app");
const F = s => s.replace(/ ([?!;:»])/g, "\u202f$1").replace(/« /g, "«\u202f");

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs || {})) {
    const v = attrs[k];
    if (k === "class") e.className = v;
    else if (k.startsWith("aria-") && typeof v === "boolean") e.setAttribute(k, String(v));
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(F(String(c))));
  }
  return e;
}
const ICONS = {
  spk:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  play:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>',
  stop:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'
};
const ico = n => { const s = document.createElement("span"); s.innerHTML = ICONS[n]; s.style.display = "inline-flex"; return s; };
const norm = s => {
  s = s.toLowerCase().replace(/[’‘`]/g, "'").normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/-/g, " ");
  s = s.replace(/\bcan't\b|\bcannot\b/g, "can not").replace(/\bwon't\b/g, "will not")
       .replace(/\bi'm\b/g, "i am").replace(/\blet's\b/g, "let us")
       .replace(/\b(he|she|it|that|there|here|what|where|who|how)'s\b/g, "$1 is")
       .replace(/n't\b/g, " not").replace(/'re\b/g, " are").replace(/'ve\b/g, " have")
       .replace(/'ll\b/g, " will").replace(/'d\b/g, " would");
  return s.replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
};
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const lesson = id => LESSONS.find(l => l.id === id);

/* ---------- Audio ---------- */
const synth = window.speechSynthesis;
let voice = null;
const AUD = { on:false, token:0 };
function pickVoice(){
  if (!synth) return;
  const vs = synth.getVoices();
  voice = vs.find(v => v.lang.replace("_","-") === "en-GB") || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
}
if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener("voiceschanged", pickVoice); }
function say(text, cb){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB"; if (voice) u.voice = voice;
  u.rate = S.slow ? 0.65 : 0.92;
  u.onend = cb; u.onerror = cb;
  synth.speak(u);
}
function mark(k){
  document.querySelectorAll(".row").forEach((r, i) => r.classList.toggle("playing", i === k));
}
function setPlayBtn(){
  const b = document.getElementById("playall"); if (!b) return;
  b.replaceChildren(ico(AUD.on ? "stop" : "play"), F(AUD.on ? "Arrêter" : "Écouter la leçon"));
}
function stopAudio(){
  AUD.token++; AUD.on = false;
  if (synth) synth.cancel();
  mark(-1); setPlayBtn();
}
function speakOne(L, k){
  if (!synth) return;
  stopAudio();
  const my = AUD.token; mark(k);
  say(L.s[k][0], () => { if (my === AUD.token) mark(-1); });
}
function playAll(L){
  if (!synth) return;
  if (AUD.on) { stopAudio(); return; }
  AUD.on = true; const my = ++AUD.token; setPlayBtn();
  let i = 0;
  const next = () => {
    if (my !== AUD.token) return;
    if (i >= L.s.length) { stopAudio(); return; }
    const k = i++; mark(k);
    say(L.s[k][0], () => {
      if (my !== AUD.token) return;
      setTimeout(next, 600 + L.s[k][0].length * (S.slow ? 70 : 45));
    });
  };
  next();
}

         h("div", { class:"s" }, "Reprenez une leçon à voix haute, puis traduisez-la du français vers l’anglais."),
         h("button", { class:"btn light", onclick:() => openLesson(1) }, "Revoir la leçon 1")],
    h("div", { class:"bar", role:"progressbar", "aria-valuemin":0, "aria-valuemax":LESSONS.length, "aria-valuenow":doneN },
      h("i", { style:"width:" + Math.round(doneN / LESSONS.length * 100) + "%;background:var(--accent-ink)" })),
    h("div", { class:"progress-text", style:"color:inherit;opacity:.85" }, doneN + " leçon" + (doneN > 1 ? "s" : "") + " terminée" + (doneN > 1 ? "s" : "") + " sur " + LESSONS.length)
  );
  const how = h("details", { class:"how" },
    h("summary", null, "Comment travailler"),
    h("ol", null,
      h("li", null, "Une leçon par jour, 20 à 30 minutes. La régularité compte plus que la durée."),
      h("li", null, "Lisez les phrases en anglais, puis vérifiez avec le français. Les petits ronds jaunes renvoient aux notes."),
      h("li", null, "Écoutez chaque phrase, puis répétez à voix haute, plusieurs fois. Le mode lent aide pour la prononciation."),
      h("li", null, "Lisez les notes, puis faites les exercices. Une révision revient toutes les 7 leçons."),
      h("li", null, "Pour vous tester, masquez le français : il se dévoile d’un toucher."),
      h("li", null, "Chaque jour, ajoutez une vague active : reprenez une ancienne leçon et traduisez-la du français vers l’anglais.")
    )
  );
  const rows = wk => LESSONS.filter(l => Math.ceil(l.id / 7) === wk).map(l => {
    const d = S.done[l.id];
    return h("button", { class:"lrow" + (l.rev ? " rev" : ""), onclick:() => openLesson(l.id) },
      h("span", { class:"lnum" }, l.id),
      h("span", null, h("div", { class:"lt" }, l.f), h("div", { class:"ls" }, l.rev ? "Révision des leçons " + (l.id - 6) + " à " + (l.id - 1) : l.t)),
      d ? h("span", { class:"badge" }, d.t ? d.s + " sur " + d.t : "Terminée") : null
    );
  });
  const weeksN = Math.ceil(LESSONS.length / 7);
  const nextW = nextL ? Math.ceil(nextL.id / 7) : 1;
  const wkBlocks = Array.from({ length:weeksN }, (_, i) => h("details", { class:"wkd", open:i + 1 === nextW },
    h("summary", { class:"wk" }, "Semaine " + (i + 1) + " : leçons " + (i * 7 + 1) + " à " + Math.min(LESSONS.length, (i + 1) * 7)),
    h("div", { class:"list" }, rows(i + 1))));
  $app.replaceChildren(
    h("header", { class:"top" }, h("span", { class:"ttl" }, "Anglais jour après jour")),
    h("section", { class:"hero" },
      h("h1", null, "Un peu d’anglais, chaque jour."),
      h("p", null, LESSONS.length + " leçons pour progresser : lire, écouter, répéter, s’exercer.")),
    next, activeCard(), how,
    ...wkBlocks,
    h("p", { class:"foot" }, "Leçons originales, écrites dans l’esprit de la méthode du livre. L’audio utilise la voix anglaise de votre appareil.")
  );
  window.scrollTo(0, 0);
}

/* ---------- Écran de leçon ---------- */
function openLesson(id){ stopAudio(); V.view = "lesson"; V.id = id; V.tab = "lecon"; render(); window.scrollTo(0, 0); }
function goHome(){ stopAudio(); V.view = "home"; render(); }

function lessonView(){
  const L = lesson(V.id);
  const head = h("header", { class:"top" },
    h("button", { class:"iconbtn", "aria-label":"Retour à la liste", onclick:goHome }, ico("back")),
    h("span", { class:"ttl" }, "Leçon " + L.id + (L.rev ? " : révision" : "")));
  const title = h("section", { class:"lhead" }, h("h1", null, L.t), h("div", { class:"sub" }, L.f));
  const ctrls = h("div", { class:"ctrls" },
    synth ? h("button", { class:"chip main", id:"playall", onclick:() => playAll(L) }, ico("play"), "Écouter la leçon") : null,
    synth ? h("button", { class:"chip", "aria-pressed":S.slow, onclick:() => { S.slow = !S.slow; save(); render(true); } }, "Lent") : null,
    h("button", { class:"chip", "aria-pressed":S.hideFr, onclick:() => { S.hideFr = !S.hideFr; save(); render(true); } }, "Masquer le français")
  );
  const tabs = h("div", { class:"tabs", role:"tablist" },
    h("button", { class:"tab", role:"tab", "aria-selected":V.tab === "lecon", onclick:() => { V.tab = "lecon"; render(true); } }, "Leçon"),
    h("button", { class:"tab", role:"tab", "aria-selected":V.tab === "exos", onclick:() => { V.tab = "exos"; stopAudio(); render(true); window.scrollTo(0, 0); } }, "Exercices"));
  const noAudio = synth ? null : h("div", { class:"noaudio" }, "L’audio n’est pas disponible dans ce navigateur. Essayez un autre navigateur pour écouter les phrases.");
  $app.replaceChildren(...[head, title, ctrls, noAudio, tabs, V.tab === "lecon" ? lessonTab(L) : exosTab(L)].filter(Boolean));
}

function lessonTab(L){
  const list = h("ol", { class:"sents" }, L.s.map((s, k) => {
    const frEl = h("div", { class:"fr" + (S.hideFr ? " cover" : ""), onclick:e => { if (S.hideFr) e.currentTarget.classList.toggle("shown"); } }, s[1]);
    const en = h("button", { class:"en", "aria-label":"Écouter la phrase " + (k + 1), onclick:() => speakOne(L, k) },

      synth ? h("span", { class:"spk" }, ico("spk")) : null);
    return h("li", { class:"row" }, h("span", { class:"n" }, k + 1), en, frEl);
  }));
  const pron = h("section", { class:"card" }, h("h2", null, "Prononciation"),

  const notes = h("section", { class:"card notes" }, h("h2", null, "Notes"),
    L.n.map((t, i) => h("div", { class:"nline" }, h("span", { class:"nb" }, i + 1), h("div", null, t))));
  const go = h("div", { style:"margin-top:22px" }, h("button", { class:"btn", onclick:() => { V.tab = "exos"; stopAudio(); render(true); window.scrollTo(0, 0); } }, "Passer aux exercices"));
  return h("div", null, list, pron, notes, go);

/* ---------- Exercices ---------- */
function exState(L){ return EX[L.id] || (EX[L.id] = { fr:{}, en:{}, q:{}, opts:{} }); }
function counts(L){
  const st = exState(L);
  const total = L.e.fr.length + L.e.en.length + L.e.q.length;
  const answered = Object.keys(st.fr).length + Object.keys(st.en).length + Object.keys(st.q).length;
  let good = 0;
  for (const k in st.fr) if (st.fr[k] === "ok") good++;
  for (const k in st.en) if (st.en[k].ok) good++;
  for (const k in st.q) if (st.q[k].ok) good++;
  return { total, answered, good };
}
function refreshResult(L){
  const c = counts(L);
  const slot = document.getElementById("resultslot"); if (!slot) return;
  if (c.answered < c.total) { slot.replaceChildren(); return; }
  S.done[L.id] = { s:c.good, t:c.total }; save();
  const ratio = c.good / c.total;
  slot.replaceChildren(h("section", { class:"result", "aria-live":"polite" },
    h("div", { class:"big" }, "Score : " + c.good + " sur " + c.total),
    h("p", null, ratio >= 0.8 ? "Très bien. Vous pouvez passer à la suite." : "Relisez les notes, réécoutez la leçon, puis recommencez les exercices."),
    h("div", { class:"two" },
      L.id < LESSONS.length ? h("button", { class:"btn light", onclick:() => openLesson(L.id + 1) }, "Leçon suivante") : null,
      h("button", { class:"btn light", style:"background:transparent;color:inherit", onclick:() => { delete EX[L.id]; render(true); window.scrollTo(0, 0); } }, "Recommencer"),
      h("button", { class:"btn light", style:"background:transparent;color:inherit", onclick:goHome }, "Toutes les leçons"))));
}
function exFr(L, i){
  const st = exState(L), [en, fr] = L.e.fr[i], res = st.fr[i];
  const box = h("div", { class:"item" + (res ? " " + res : "") }, h("div", { class:"q" }, en));
  if (!res) {
    const reveal = h("div", null);
    const btn = h("button", { class:"btn ghost", onclick:() => {
      reveal.replaceChildren(
        h("div", { class:"fb", style:"background:var(--accent-soft);color:var(--ink)" }, h("b", null, fr)),
        h("div", { class:"two" },
          h("button", { class:"btn", onclick:() => { st.fr[i] = "ok"; box.replaceWith(exFr(L, i)); refreshResult(L); } }, "Je savais"),
          h("button", { class:"btn ghost", onclick:() => { st.fr[i] = "ko"; box.replaceWith(exFr(L, i)); refreshResult(L); } }, "À revoir")));
      btn.remove();
    } }, "Voir la traduction");
    box.append(btn, reveal);
  } else {
    box.append(h("div", { class:"fb " + res }, res === "ok" ? "Noté : acquis. " : "Noté : à revoir. ", h("b", null, fr)));
  }
  return box;
}
function exEn(L, i){
  const st = exState(L), [frTxt, answer, alts] = L.e.en[i], res = st.en[i];
  const box = h("div", { class:"item" + (res ? (res.ok ? " ok" : " ko") : "") }, h("div", { class:"q" }, frTxt));
  if (!res) {
    const input = h("input", { class:"ans", type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Votre réponse en anglais", placeholder:"Votre réponse en anglais" });
    const check = () => {
      const v = input.value.trim(); if (!v) { input.focus(); return; }
      const ok = [answer].concat(alts || []).some(a => norm(a) === norm(v));
      st.en[i] = { ok, val:v }; box.replaceWith(exEn(L, i)); refreshResult(L);
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
    box.append(input, h("div", { class:"two" }, h("button", { class:"btn", onclick:check }, "Vérifier")));
  } else {
    box.append(h("div", { class:"fb " + (res.ok ? "ok" : "ko") }, res.ok ? "Exact : " : "Réponse attendue : ", h("b", null, answer),
      res.ok ? null : h("div", null, "Votre réponse : " + res.val)));
  }
  return box;
}
function exQ(L, i){
  const st = exState(L), [q, ans, wrongs] = L.e.q[i], res = st.q[i];
  if (!st.opts[i]) st.opts[i] = shuffle([ans].concat(wrongs));
  const box = h("div", { class:"item" + (res ? (res.ok ? " ok" : " ko") : "") }, h("div", { class:"q" }, q));
  const opts = h("div", { class:"opts" }, st.opts[i].map(o => {
    let cls = "opt";
    if (res) { if (o === ans) cls += " right"; else if (o === res.pick) cls += " wrong"; }
    return h("button", { class:cls, disabled:!!res, onclick:() => { st.q[i] = { pick:o, ok:o === ans }; box.replaceWith(exQ(L, i)); refreshResult(L); } }, o);
  }));
  box.append(opts);
  if (res) box.append(h("div", { class:"fb " + (res.ok ? "ok" : "ko") }, res.ok ? "Exact." : "Réponse correcte : ", res.ok ? null : h("b", null, ans)));
  return box;
}
function exosTab(L){
  const wrap = h("div", null,
    h("h2", { class:"exh" }, "A. Traduire en français"),
    h("p", { class:"hint" }, "Traduisez de tête, puis vérifiez et notez-vous honnêtement."),
    L.e.fr.map((_, i) => exFr(L, i)),
    h("h2", { class:"exh" }, "B. Traduire en anglais"),
    h("p", { class:"hint" }, "Les majuscules, les accents et les formes courtes (I’m ou I am) sont acceptés."),
    L.e.en.map((_, i) => exEn(L, i)),
    h("h2", { class:"exh" }, "C. Quiz"),
    L.e.q.map((_, i) => exQ(L, i)),
    h("div", { id:"resultslot" }));
  setTimeout(() => refreshResult(L), 0);
  return wrap;
}

/* ---------- Vague active : retraduire d’anciennes leçons ---------- */
function pickReview(){
  const ids = LESSONS.filter(l => S.done[l.id]).map(l => l.id);
  if (!ids.length) return null;
  const cnt = id => S.reviewed[id] || 0;
  return ids.sort((a, b) => cnt(a) - cnt(b) || a - b)[0];
}
function startActive(id){ stopAudio(); V.view = "active"; V.act = { id, i:0, good:0, saved:false }; render(); window.scrollTo(0, 0); }
function activeCard(){
  const id = pickReview();
  if (!id) return h("section", { class:"card" }, h("h2", null, "Vague active"),
    h("p", { class:"hint", style:"margin:0" }, "Terminez une première leçon pour débloquer ce mode : vous retraduirez les anciennes leçons du français vers l’anglais."));
  const L = lesson(id), n = S.reviewed[id] || 0;
  const sel = h("select", { class:"sel", "aria-label":"Choisir une leçon à reprendre", onchange:e => { if (e.target.value) startActive(+e.target.value); } },
    h("option", { value:"" }, "Choisir une autre leçon"),
    LESSONS.filter(l => S.done[l.id]).map(l => h("option", { value:String(l.id) }, "Leçon " + l.id + " : " + l.f)));
  return h("section", { class:"card active" }, h("h2", null, "Vague active"),
    h("p", { class:"hint" }, "Reprenez une leçon terminée : lisez le français et écrivez la phrase en anglais."),
    h("div", { class:"t2" }, "Leçon " + L.id + " : " + L.f),
    h("div", { class:"progress-text", style:"margin:0 0 10px" }, n ? "Déjà reprise " + n + (n > 1 ? " fois" : " fois") : "Pas encore reprise"),
    h("div", { class:"two", style:"margin-top:0" }, h("button", { class:"btn", onclick:() => startActive(id) }, "Commencer"), sel));
}
function activeView(){
  const A = V.act, L = lesson(A.id);
  const head = h("header", { class:"top" },
    h("button", { class:"iconbtn", "aria-label":"Retour à la liste", onclick:goHome }, ico("back")),
    h("span", { class:"ttl" }, "Vague active : leçon " + L.id));
  const title = h("section", { class:"lhead" }, h("h1", null, L.f), h("div", { class:"sub" }, "Traduisez chaque phrase en anglais."));
  $app.replaceChildren(head, title, A.i >= L.s.length ? activeEnd(L, A) : activeStep(L, A));
}
function activeNext(){ V.act.i++; render(); window.scrollTo(0, 0); }
function activeStep(L, A){
  const en = L.s[A.i][0], fr = L.s[A.i][1];
  const box = h("div", { class:"item" },
    h("div", { class:"hint", style:"margin-bottom:6px" }, "Phrase " + (A.i + 1) + " sur " + L.s.length),
    h("div", { class:"q" }, fr));
  const input = h("input", { class:"ans", type:"text", autocomplete:"off", autocapitalize:"off", spellcheck:"false", "aria-label":"Votre traduction en anglais", placeholder:"Votre traduction en anglais" });
  const listen = () => { if (synth) { stopAudio(); say(en, () => {}); } };
  const feedback = h("div", null);
  const finish = (ok, typed) => {
    input.disabled = true; actions.replaceChildren();
    if (ok) A.good++;
    box.classList.add(ok ? "ok" : "ko");
    feedback.replaceChildren(h("div", { class:"fb " + (ok ? "ok" : "ko"), "aria-live":"polite" }, ok ? "Exact : " : "Phrase du cours : ", h("b", null, en),
      !ok && typed ? h("div", null, "Votre réponse : " + typed) : null));
    const row = h("div", { class:"two" });
    if (!ok) row.append(h("button", { class:"btn ghost", onclick:() => { A.good++; box.classList.remove("ko"); box.classList.add("ok"); row.firstChild.remove(); } }, "Ma phrase était juste"));
    if (synth) row.append(h("button", { class:"btn ghost", onclick:listen }, "Écouter"));
    row.append(h("button", { class:"btn", onclick:activeNext }, A.i + 1 < L.s.length ? "Phrase suivante" : "Voir le résultat"));
    feedback.append(row);
  };
  const check = () => {
    const v = input.value.trim(); if (!v) { input.focus(); return; }
    finish(norm(v) === norm(en), v);
  };
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !input.disabled) check(); });
  const actions = h("div", { class:"two" },
    h("button", { class:"btn", onclick:check }, "Vérifier"),
    h("button", { class:"btn ghost", onclick:() => finish(false, "") }, "Je ne sais pas"));
  box.append(input, actions, feedback);
  setTimeout(() => input.focus({ preventScroll:true }), 0);
  return box;
}
function activeEnd(L, A){
  if (!A.saved) { A.saved = true; S.reviewed[L.id] = (S.reviewed[L.id] || 0) + 1; save(); }
  const ratio = A.good / L.s.length;
  const nextId = pickReview();
  return h("section", { class:"result", "aria-live":"polite" },
    h("div", { class:"big" }, "Score : " + A.good + " sur " + L.s.length),
    h("p", null, ratio >= 0.8 ? "Très bien. Cette leçon est solide." : "Relisez la leçon et ses notes, puis recommencez dans un ou deux jours."),
    h("div", { class:"two" },
      nextId ? h("button", { class:"btn light", onclick:() => startActive(nextId) }, "Autre leçon à reprendre") : null,
      h("button", { class:"btn light", style:"background:transparent;color:inherit", onclick:() => startActive(L.id) }, "Recommencer"),
      h("button", { class:"btn light", style:"background:transparent;color:inherit", onclick:() => openLesson(L.id) }, "Revoir la leçon"),
      h("button", { class:"btn light", style:"background:transparent;color:inherit", onclick:goHome }, "Toutes les leçons")));
}

function render(keepScroll){
  const y = window.scrollY;
  if (V.view === "home") home(); else if (V.view === "active") activeView(); else lessonView();
  if (keepScroll) window.scrollTo(0, y);
}
render();
</script>
